identity_providers:
  oidc:
    clients:
      - client_name: 'Gatus'
        client_id: {{ secret "/run/secrets/gatus-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/gatus-oidc-client-secret_authelia" | mindent 10 "|" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        redirect_uris:
          - 'https://status.haddock.cc/authorization-code/callback'
        scopes:
          - 'openid'
      - client_name: 'Miniflux'
        client_id: {{ secret "/run/secrets/miniflux-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/miniflux-oidc-client-secret_authelia" | mindent 10 "|" | msquote }}
        public: false
        require_pkce: true
        pkce_challenge_method: 'S256'
        authorization_policy: 'one_factor'
        redirect_uris:
          - 'https://news.haddock.cc/oauth2/oidc/callback'
        scopes:
          - 'email'
          - 'name'
          - 'openid'
          - 'preferred_username'
          - 'profile'
      - client_name: "Vikunja"
        client_id: {{ secret "/run/secrets/vikunja-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/vikunja-oidc-client-secret_authelia" | mindent 10 "|" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        redirect_uris:
          - "https://tasks.haddock.cc/auth/openid/authelia"
        scopes:
          - "openid"
          - "email"
          - "profile"
