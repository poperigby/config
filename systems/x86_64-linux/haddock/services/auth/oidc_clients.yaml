# Hashed client secrets go here, and unhashed ones go in the client configurations

identity_providers:
  oidc:
    clients:
      # https://github.com/gtsteffaniak/filebrowser/wiki/Configuration-And-Examples#openid-connect-configuration-oidc
      - client_name: "FileBrowser"
        client_id: {{ secret "/run/secrets/filebrowser-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/haddock/filebrowser/oidc_client_secret/authelia" | mindent 10 "|" | msquote }}
        public: false
        authorization_policy: "one_factor"
        scopes:
          - "openid"
          - "email"
          - "profile"
        grant_types:
          - "authorization_code" # required
        redirect_uris:
          - "https://files.haddock.cc/api/auth/oidc/callback"
        userinfo_signed_response_alg: "none"
        token_endpoint_auth_method: "client_secret_basic"
      # https://immich.app/docs/administration/oauth/
      - client_name: "Immich"
        client_id: {{ secret "/run/secrets/immich-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/haddock/immich/oidc_client_secret/authelia" | mindent 10 "|" | msquote }}
        public: false
        authorization_policy: "one_factor"
        redirect_uris:
            - "app.immich:///oauth-callback"
            - "https://photos.haddock.cc/auth/login"
            - "https://photos.haddock.cc/user-settings"
        scopes:
            - "openid"
            - "profile"
            - "email"
        token_endpoint_auth_method: "client_secret_post"
      # https://docs.karakeep.app/configuration/#authentication--signup
      - client_name: "Karakeep"
        client_id: {{ secret "/run/secrets/karakeep-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/haddock/karakeep/oidc_client_secret/authelia" | mindent 10 "|" | msquote }}
        public: false
        authorization_policy: "one_factor"
        claims_policy: "karakeep"
        redirect_uris:
          - "https://keep.haddock.cc/api/auth/callback/custom"
        scopes:
          - "openid"
          - "profile"
          - "email"
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
      # https://docs.mealie.io/documentation/getting-started/authentication/oidc
      - client_name: "Mealie"
        client_id: {{ secret "/run/secrets/mealie-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/haddock/mealie/oidc_client_secret/authelia" | mindent 10 "|" | msquote }}
        public: false
        authorization_policy: "one_factor"
        require_pkce: true
        pkce_challenge_method: "S256"
        redirect_uris:
          - "https://food.haddock.cc/login"
      # https://miniflux.app/docs/howto.html#oauth2
      - client_name: "Miniflux"
        client_id: {{ secret "/run/secrets/miniflux-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/haddock/miniflux/oidc_client_secret/authelia" | mindent 10 "|" | msquote }}
        authorization_policy: "one_factor"
        require_pkce: true
        pkce_challenge_method: "S256"
        redirect_uris:
          - "https://news.haddock.cc/oauth2/oidc/callback"
      # https://lennart-k.github.io/rustical/setup/oidc
      - client_name: "Rustical"
        client_id: {{ secret "/run/secrets/rustical-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/haddock/rustical/oidc_client_secret/authelia" | mindent 10 "|" | msquote }}
        public: false
        authorization_policy: "one_factor"
        consent_mode: "implicit"
        scopes: ["openid", "profile", "groups"]
        token_endpoint_auth_method: "client_secret_basic"
        redirect_uris:
          - "https://dav.haddock.cc/frontend/login/oidc/callback"
      # https://vikunja.io/docs/openid
      - client_name: "Vikunja"
        client_id: {{ secret "/run/secrets/vikunja-oidc-client-id_authelia" | mindent 10 "|" | msquote }}
        client_secret: {{ secret "/run/secrets/haddock/vikunja/oidc_client_secret/authelia" | mindent 10 "|" | msquote }}
        authorization_policy: "one_factor"
        redirect_uris:
          - "https://tasks.haddock.cc/auth/openid/authelia"
